name: Build Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android host
        run: bash scripts/bootstrap_android.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source on runner
        run: dart format lib test
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test --reporter expanded
      - name: Build release-mode preview APK
        run: flutter build apk --release
      - name: Prepare download
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/CarsNight-preview.apk
          cp docs/ANDROID_TESTING.md artifacts/INSTALL.md
          cd artifacts
          sha256sum CarsNight-preview.apk > SHA256SUMS.txt
      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CarsNight-test-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload resolved source for reproducibility
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CarsNight-resolved-source
          path: |
            lib/
            test/
            pubspec.lock
            android/
          retention-days: 14
      - name: Write download instructions
        run: |
          echo '## Cars Night test APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Analysis and tests passed; release-mode APK built with a development signing key.' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download APK ZIP](${{ steps.apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract CarsNight-preview.apk from the ZIP and install it on Android. This is the offline prototype.' >> "$GITHUB_STEP_SUMMARY"
